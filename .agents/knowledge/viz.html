const NODES=[{"id": "games/revomon_novus/combat_slingshot", "type": "Combat Mechanics", "title": "Revomon: Novus \u2014 Combat Initiation & Slingshot Mechanics", "description": "Slingshot Aim Mode activation, overworld projectile targeting, encounter triggering, and party battle dynamics.", "tags": ["revomon-novus", "combat", "slingshot", "aim-mode", "battle-system", "encounters"], "group": "games", "sz": 34, "status": "stable", "stale_after": "", "generated": {"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}, "verified": [{"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}], "sources": [{"title": "Revomon: Novus Unity Android Client v0.0.1", "resource": "package:com.revomon.vr.novus", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Revomon: Novus \u2014 Combat Initiation & Slingshot Mechanics\n\nUnlike traditional monster battlers with random grass encounters, ***Revomon: Novus*** uses physical overworld projectile targeting to initiate battles.\n\n---\n\n## 1. Slingshot Aim Mode Activation\n\n1. **Locating Encounters**: Wild Revomon spawn as physical 3D entities roaming fields outside city safe zones (e.g. Glimmerhaven north fields).\n2. **Opening Slingshot Mode**:\n   - Tap Master Arrow `(0.952, 0.893)` $\\rightarrow$ Action Menu Level 1.\n   - Tap Top Button `(0.938, 0.787)` $\\rightarrow$ Action Menu Level 2.\n   - Tap **Slingshot Aim** `(0.868, 0.685)` `[2031, 740]`:\n     - Camera transitions to an over-the-shoulder view.\n     - A 3D targeting reticle projects onto display center $(0.500, 0.500)$.\n     - Aim button illuminates green to signify active state.\n\n---\n\n## 2. Targeting & Firing\n\n1. **Crosshair Alignment**:\n   - Rotate camera view using fine camera drags on the right hemisphere to center the reticle on the wild Revomon.\n   - Players retain full locomotion and jump agility while in Aim Mode.\n2. **Discharging the Orb**:\n   - Tap the Slingshot button a second time: Launches an energy projectile along the center vector.\n   - Projectile collision with the target freezes overworld physics and transitions into the turn-based 3D combat stadium.\n   - Aim Mode automatically deactivates upon firing.\n\n---\n\n## 3. Battle Lead & Party Management\n\n* **Active Belt**: Tamers carry up to **6 Revomon**.\n* **Overworld Companion**: Tapping any of the 6 slots in the Equipped Team menu summons that Revomon into the 3D overworld.\n* **Battle Lead Designation**: The Revomon currently summoned alongside the player automatically enters combat as the active lead battler.\n* **PC Terminals**: Located inside Revocenters (domed structures with cyan glass). Interacting with PC terminals allows depositing, withdrawing, and party healing while completely suppressing the server AFK disconnect timer.\n\nSee also: [HUD Interface](./hud_interface.md) and [Locomotion Guide](./locomotion.md)."}, {"id": "games/revomon_novus/hud_interface", "type": "Interface Specification", "title": "Revomon: Novus \u2014 HUD & Interface State Machine", "description": "HUD touch anchors, minimap radar geometry, action menu hierarchy, and UI state machine transitions.", "tags": ["revomon-novus", "hud", "ui-state-machine", "minimap", "anchors", "touch-mapping"], "group": "games", "sz": 38, "status": "stable", "stale_after": "", "generated": {"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}, "verified": [{"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}], "sources": [{"title": "Revomon: Novus Unity Android Client v0.0.1", "resource": "package:com.revomon.vr.novus", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Revomon: Novus \u2014 HUD & Interface State Machine\n\nThe interface layout in ***Revomon: Novus*** follows a normalized coordinate layout designed for fixed landscape orientation.\n\n---\n\n## 1. Key HUD Anchors\n\n| Element | Normalized Anchor $(r_x, r_y)$ | Reference Pixels ($2340 \\times 1080$) | Function / Description |\n| :--- | :--- | :--- | :--- |\n| **Minimap Radar** | $(0.075, 0.130)$ | $(175, 140)$ | Compass with Cardinal points (N, S, E, W), blue player beacon, and yellow entity blips. |\n| **Location & Level** | $(0.200, 0.150)$ | $(468, 162)$ | Displays current region (e.g. `Glimmerhaven city - level 10 -`) and player tamer name. |\n| **Chat Bubble** | $(0.033, 0.280)$ | $(77, 302)$ | Opens local / global multi-player communication box. |\n| **Virtual Movement Pad** | $(0.120, 0.650)$ | $(280, 702)$ | Floating left joystick zone. Touch-down activates omnidirectional movement. |\n| **Camera Touch Surface** | $(0.550, 0.500)$ | $(1287, 540)$ | Full right hemisphere of display. Swipes adjust yaw and pitch. |\n| **Action Menu Master Arrow**| $(0.952, 0.893)$ | $(2227, 964)$ | Circular dark badge with white arrow. Expands Menu Level 1. |\n| **Shop & Inventory** | $(0.885, 0.090)$ | $(2070, 97)$ | Market stall and inventory pass icons. |\n\n---\n\n## 2. Control Hierarchy & Menu State Machine\n\nThe action controls follow a nested multi-level tree structure:\n\n```mermaid\ngraph TD\n    A[\"Overworld Exploration (Idle HUD)\"] -->|\"Tap Master Arrow (0.952, 0.893)\"| B[\"Action Menu (Level 1)\"]\n    B -->|\"Tap Left Button (0.898, 0.870)\"| C[\"Equipped Team Menu (6 Slots)\"]\n    B -->|\"Tap Top Button (0.938, 0.787)\"| D[\"Combat & Agility Submenu (Level 2)\"]\n    D -->|\"Tap Slingshot (0.868, 0.685)\"| E[\"Slingshot Aim Mode (Crosshair On)\"]\n    D -->|\"Tap Jump (0.955, 0.618)\"| F[\"Jump Action (Elevation Traverse)\"]\n    B -->|\"Re-tap Master Arrow\"| A\n    E -->|\"Re-tap Slingshot / Fire\"| A\n```\n\n### 2.1 Action Menu Level 1\nTapping the Master Arrow `(0.952, 0.893)` reveals two primary sub-buttons:\n1. **Left Button** `(0.898, 0.870)` `[2101, 940]`: Opens the Equipped Team Menu (displays 6 active Revomon slots).\n2. **Top Button** `(0.938, 0.787)` `[2195, 850]`: Expands Action Menu Level 2.\n\n### 2.2 Action Menu Level 2\nExpands into combat and agility controls:\n1. **Slingshot / Aim Button** `(0.868, 0.685)` `[2031, 740]`: Toggles Slingshot Aim Mode.\n2. **Jump Button** `(0.955, 0.618)` `[2235, 667]`: Triggers jump physics for hopping over rocks or scaling slopes.\n\n### 2.3 Player Menu Overlay\nTapping the minimap radar `(175, 140)` opens the **Player Menu** overlay:\n* Left sidebar: `Progress`, `Map`, `Market`, `Avatar`, `Clan`.\n* `Map` row (`\u2248120, 350`): Opens fullscreen Novus island map (suppresses server AFK timer).\n* Close button: Red X at `(0.021, 0.028)` `[50, 30]`.\n\nSee also: [Locomotion Guide](./locomotion.md) and [Combat & Slingshot](./combat_slingshot.md)."}, {"id": "games/revomon_novus/locomotion", "type": "Locomotion Guide", "title": "Revomon: Novus \u2014 Locomotion, Camera & Multi-Touch Controls", "description": "Virtual analog stick kinematics, continuous locomotion, camera yaw/pitch dynamics, and dual-thumb multi-touch protocols.", "tags": ["revomon-novus", "locomotion", "camera", "multitouch", "joystick", "afk-prevention"], "group": "games", "sz": 40, "status": "stable", "stale_after": "", "generated": {"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}, "verified": [{"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}], "sources": [{"title": "Galaxy S24 Ultra Multi-Touch Locomotion Fieldwork", "resource": "device:SM-S928U", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Revomon: Novus \u2014 Locomotion, Camera & Multi-Touch Controls\n\n---\n\n## 1. Virtual Movement Pad Kinematics\n\nThe analog joystick floats in the lower-left display quadrant with resting center anchor at:\n$$(r_x, r_y) = (0.120, 0.650) \\implies (280, 702)\\text{ px on }2340 \\times 1080$$\n\n### Displacement Vectors\n* **Forward (Up)**: `(280, 702) -> (280, 550)`. Velocity $\\approx 4\\text{ m/s}$ ($\\sim 5\\text{--}7\\text{ m}$ displacement over $1500\\text{ ms}$).\n* **Backward (Down)**: `(280, 702) -> (280, 850)`. Avatar performs immediate $180^\\circ$ turn facing camera.\n* **Strafe Left**: `(280, 702) -> (80, 702)`. Left profile visible.\n* **Strafe Right**: `(280, 702) -> (480, 702)`. Right profile visible.\n* **Anti-AFK Micro-Nudge**: `swipe(280, 702 -> 280, 550, 400ms)` + $0.8\\text{ s}$ settle. Safe to interleave every $\u003c180\\text{ s}$ to prevent server idle disconnects.\n\n### Continuous Locomotion Pattern\n* **Legacy (ADB `input swipe`)**: Repeated $1500\\text{ ms}$ swipes incur a stop-start stuttering gait because swipe releases touch at conclusion.\n* **Modern (`held_touch` / `touch_hold`)**: Holding touch via `dev.touch_down(280, 702)` -> `dev.touch_move(280, 550)` produces seamless, continuous forward walking indefinitely with zero stutter.\n\n---\n\n## 2. Camera Dynamics & Rotation\n\n* **Camera Surface**: Entire right hemisphere $x \\in [1170, 2340]$, $y \\in [100, 980]$. Use $y = 540$ center to avoid HUD elements.\n* **Unity Deadzone Bypass**: Unity gates coarse single-swipe rotation under 600 px. Emitting dense, interpolated move streams (`dev.precise_drag(steps=24, step_delay_ms=16)`) completely bypasses the deadzone, enabling sub-$30^\\circ$ trims for crosshair aiming.\n* **Yaw Gain (Large Flicks)**:\n  * Horizontal swipe of $800\\text{ px}$ $\\approx 120^\\circ$ rotation.\n  * Horizontal swipe of $1000\\text{ px}$ $\\approx 120^\\circ\\text{--}150^\\circ$ rotation.\n* **Pitch Range**: Clamped to approximately $\\pm 15\\text{--}20^\\circ$. Default pitch is optimal for navigation.\n\n---\n\n## 3. Concurrent Two-Thumb Multi-Touch Protocol\n\nTrue two-thumb play (holding forward locomotion while rotating the camera concurrently) is executed via PymordialDroid's `scrcpy-control` multi-touch daemon:\n\n```python\n# Initialize persistent multi-touch daemon\ndev.start_multitouch()\n\n# Left Thumb (slot 0): Grab joystick knob and push forward\ndev.touch_down(280, 702, slot=0)\ndev.touch_move(280, 550, slot=0)\n\n# Right Thumb (slot 1): Concurrently rotate camera via precise interpolated drag\ndev.precise_drag(1755, 540, 1305, 540, steps=35, step_delay_ms=25, slot=1)\n\n# Release Left Thumb\ndev.touch_up(slot=0)\n```\n\n* **Latency**: $\u003c1\\text{ ms}$ over localhost tunnel.\n* **Tested Environment**: Samsung Galaxy S24 Ultra (`SM-S928U`, Android 16), zero dropped frames.\n\n---\n\n## 4. Server Inactivity Rules & Anti-AFK\n\n* **Inactivity Disconnect**: Server terminates sessions after **1260 seconds (21 minutes)** of inactivity.\n* **Camera Input Does NOT Reset AFK**: Only character locomotion vectors on the virtual joystick reset the server idle timer.\n* **Safe Parking**: Opening the Fullscreen Map modal suppresses the idle timeout.\n\nSee also: [Touch Injection Architecture](../../pymordialdroid/touch_injection.md) and [HUD Interface](./hud_interface.md)."}, {"id": "games/revomon_novus/profile", "type": "Game Profile", "title": "Revomon: Novus \u2014 Game Profile & Geometry Normalization", "description": "Application package identifiers, Unity engine profile, Web3 Immutable Passport authentication, and normalized coordinate space math.", "tags": ["revomon-novus", "unity", "architecture", "coordinates", "geometry", "immutable-passport"], "group": "games", "sz": 32, "status": "stable", "stale_after": "", "generated": {"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}, "verified": [{"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}], "sources": [{"title": "Revomon: Novus Unity Android Client v0.0.1", "resource": "package:com.revomon.vr.novus", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Revomon: Novus \u2014 Game Profile & Geometry Normalization\n\n> [!NOTE]\n> This guide defines the foundational parameters, engine profile, and coordinate system for ***Revomon: Novus***. For UI anchors and menu states, see [HUD Interface](./hud_interface.md). For movement, see [Locomotion Guide](./locomotion.md). For battle systems, see [Combat & Slingshot](./combat_slingshot.md).\n\n---\n\n## 1. Game Profile & Architecture\n\n| Parameter | Specification |\n| :--- | :--- |\n| **Title** | *Revomon: Novus* |\n| **Engine / Platform** | Unity (Android / iOS / Apple) |\n| **Package / App ID** | `com.revomon.vr.novus` |\n| **Main Activity** | `com.revomon.vr.novus/com.unity3d.player.UnityPlayerActivity` |\n| **Client Version** | `v0.0.1` |\n| **Authentication Layer** | Web3 Immutable Passport Integration (SSO) |\n| **Display Mode** | Fixed Landscape |\n| **Coordinate Standard** | Normalized ratio space $(r_x, r_y) \\in [0.0, 1.0]$ |\n\n---\n\n## 2. Client Geometry & Resolution Normalization\n\nBecause *Revomon: Novus* is deployed across devices with differing aspect ratios (16:9, 19.5:9, 20:9), all UI elements and touch coordinates are mapped as normalized ratios $(r_x, r_y) \\in [0.0, 1.0]$.\n\nThe target pixel position for any device resolution $(W_{\\text{screen}}, H_{\\text{screen}})$ is calculated as:\n\n$$X_{\\text{target}} = \\lfloor r_x \\cdot W_{\\text{screen}} \\rfloor, \\quad Y_{\\text{target}} = \\lfloor r_y \\cdot H_{\\text{screen}} \\rfloor$$\n\n### Reference Resolution\nTesting and live field verification are calibrated against the Samsung Galaxy S24 Ultra (`SM-S928U`):\n* Screen width: $W = 2340\\text{ px}$\n* Screen height: $H = 1080\\text{ px}$\n* Aspect ratio: $19.5:9$\n* Live stream feed: $960 \\times 442\\text{ px}$\n\nSee also: [HUD Interface](./hud_interface.md) and [Vision Anchors](./vision_anchors.md)."}, {"id": "games/revomon_novus/vision_anchors", "type": "Vision Specification", "title": "Revomon: Novus \u2014 Vision Grounding & State Detection Anchors", "description": "Computer vision heuristics, normalized color masks, title screen detection, and asset template matching.", "tags": ["revomon-novus", "vision", "opencv", "state-detection", "title-screen", "color-masks", "templates"], "group": "games", "sz": 38, "status": "stable", "stale_after": "", "generated": {"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}, "verified": [{"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}], "sources": [{"title": "Revomon: Novus Unity Android Client v0.0.1", "resource": "package:com.revomon.vr.novus", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Revomon: Novus \u2014 Vision Grounding & State Detection Anchors\n\nBecause Revomon uses custom stylized fonts that cause OCR engines (e.g. Tesseract) to fail, vision automation relies on **normalized color thresholding**, **pixel-diff analysis**, and **OpenCV template matching**.\n\n---\n\n## 1. Title Screen & Authentication Detection\n\n### 1.1 Play Button Anchor\n* Normalized Region: $(r_x, r_y) \\in [0.35, 0.65] \\times [0.78, 0.92]$\n* Tap Coordinate: `(0.500, 0.829)` $\\implies (1170, 895)\\text{ px}$\n* Color Filter: Yellow pixels $(R > 180, G > 140, B \u003c 120)$\n* Detection Rule: Relative threshold **$>5\\%$ yellow pixels** within bounding box. (At $2340 \\times 1080 \\approx 1800\\text{ px}$; at $960 \\times 442 \\approx 19\\text{ px}$).\n\n### 1.2 Connect Button Anchor\n* Normalized Region: $(0.40, 0.76)\\text{--}(0.60, 0.82)$\n* Tap Coordinate: `(0.500, 0.823)` $\\implies (1170, 888)\\text{ px}$\n* Color Filter: Cyan pixels $(R > 150, G > 190, B > 100)$\n\n### 1.3 Space Background Filter\n* Title screen features animated celestial backdrop with $>15\\%$ dark pixels $(\\text{brightness} \u003c 30)$, whereas overworld contains $\u003c2\\%$.\n\n---\n\n## 2. Overworld Verification Heuristic\n\nA frame represents an active, controllable overworld state when:\n1. `get_current_app()` equals `com.revomon.vr.novus`.\n2. `is_title_screen()` evaluates `False`.\n3. Dark pixel ratio $\u003c10\\%$ and black ratio $\u003c25\\%$ (not a loading bar).\n4. At least one HUD landmark is verified:\n   - **Minimap Compass**: Bright blips ($>10\\text{ px}$, $\\text{brightness} > 200$) in $(0.04, 0.05)\\text{--}(0.10, 0.18)$.\n   - **Shop Icon**: Light pixels ($>15\\text{ px}$, $\\text{brightness} > 200$) in $(0.85, 0.06)\\text{--}(0.92, 0.12)$.\n   - **Location Label**: Light pixels in $(0.15, 0.06)\\text{--}(0.30, 0.16)$.\n\n---\n\n## 3. Reconnection Flow Timing\n\nWhen an AFK disconnect returns the client to title:\n1. Tap **Play** $\\rightarrow$ Immutable Passport initializes in background ($\\approx 4\\text{--}5\\text{ s}$).\n2. Tap **Connect** $\\rightarrow$ Server connection establishes.\n3. **Loading Screen** with green progress bar ($\\approx 9\\text{--}14\\text{ s}$).\n4. Total Recovery Time: $\\approx 13.6\\text{ seconds}$ to return to active overworld state at saved spawn.\n\n---\n\n## 4. UI Asset Crops (`assets/`)\n\nTemplate assets for OpenCV template matching are stored under `.agents/knowledge/assets/`:\n* Minimap radar & player menu buttons: `menu_Avatar.png`, `menu_Clan.png`, `menu_Map.png`, `menu_Market.png`, `menu_Progress.png`.\n* Action menu levels: `menu_explore_menu_open.png`, `menu_explore_btn_1_left.png`, `menu_explore_btn_3_top.png`.\n* Submenu anchors: `menu_explore_gear_tr.png`, `sidebar_pos_settings_1.png`.\n\nSee also: [Game Profile](./profile.md), [HUD Interface](./hud_interface.md), and [Display Streaming](../../pymordialdroid/display_streaming.md)."}, {"id": "pymordialdroid/architecture", "type": "Architecture Guide", "title": "PymordialDroid \u2014 Automation Architecture & System Overview", "description": "High-level host architecture, bundled binary resolution, wireless ADB networking, and Pymordial contract implementations.", "tags": ["android", "architecture", "adb", "scrcpy", "networking", "pymordial"], "group": "pymordialdroid", "sz": 58, "status": "stable", "stale_after": "", "generated": {"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}, "verified": [{"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}], "sources": [{"title": "Genymobile scrcpy", "resource": "https://github.com/Genymobile/scrcpy", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "Android Debug Bridge (ADB)", "resource": "https://developer.android.com/tools/adb", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# PymordialDroid \u2014 Automation Architecture & System Overview\n\n> [!NOTE]\n> This guide documents the host-side infrastructure, wireless ADB networking, process orchestration, and Pymordial contract implementation. For configuration files and layouts, see [Configuration Reference](./configuration.md). For video streaming, see [Display Streaming](./display_streaming.md). For low-level input, see [Touch Injection](./touch_injection.md). For recorded fieldwork gaps, see [Issues Tracker](./issues.md).\n\n---\n\n## 1. Automation Architecture\n\n```mermaid\ngraph LR\n    subgraph Host[\"PC / Steam Deck (Windows 11)\"]\n        Commander[\"PymordialDroid (FleetCommander TUI)\"]\n        Scrcpy[\"scrcpy 4.1 (Direct3D 11 Renderer)\"]\n        ADBClient[\"adb.exe (Bundled inside bin/scrcpy)\"]\n    end\n    subgraph Transport[\"Local Wi-Fi / USB Network\"]\n        TCP[\"TCP/IP Socket :5555\"]\n    end\n    subgraph Device[\"Physical Android Device (Galaxy S24 Ultra)\"]\n        ADBD[\"adbd (Android Native Daemon)\"]\n        App[\"Target Android Application\"]\n    end\n\n    Commander -->|Async Python commands| TCP\n    Scrcpy -->|60 FPS H.264 video feed| TCP\n    ADBClient -->|Process orchestration| TCP\n    TCP --> ADBD\n    ADBD --> App\n```\n\n---\n\n## 2. Bundled Binaries & Path Resolution\n\nThe automation suite bundles `scrcpy` and `adb` inside `src/pymordialdroid/bin/scrcpy/`:\n\n* **ADB Executable**: `src/pymordialdroid/bin/scrcpy/adb.exe` (Version 36.0.0-13206524 / 1.0.41)\n* **Scrcpy Executable**: `src/pymordialdroid/bin/scrcpy/scrcpy.exe` (Version 4.1 / SDL 3.4.12)\n* **Scrcpy Server**: `src/pymordialdroid/bin/scrcpy/scrcpy-server` (Version 4.1)\n\nBoth binaries are dynamically resolved in `FleetCommander.__init__`:\n```python\nbase_dir = Path(__file__).resolve().parent\nadb_exe = \"adb.exe\" if sys.platform == \"win32\" else \"adb\"\nscrcpy_exe = \"scrcpy.exe\" if sys.platform == \"win32\" else \"scrcpy\"\n\nself.config = SystemConfig(\n    adb_bin_path=base_dir / \"bin\" / \"scrcpy\" / adb_exe,\n    scrcpy_bin_path=base_dir / \"bin\" / \"scrcpy\" / scrcpy_exe,\n)\n```\n\n---\n\n## 3. Wireless ADB Pairing & Persistent Port Configuration\n\n### 3.1 Initial Wireless Pairing (TLS)\nOn Android 11+, Google uses TLS for the initial Wireless Debugging handshake:\n1. From the device's \"Pair device with pairing code\" menu:\n   ```bash\n   adb pair \u003cIP>:\u003cPAIRING_PORT> \u003c6_DIGIT_PIN>\n   ```\n2. Keys are authenticated and persisted in `~/.android/adbkey` and `~/.android/adb_known_hosts.pb`.\n\n### 3.2 Persistent Port 5555 Transition\nDynamic wireless debugging ports change on every reboot or Wi-Fi reconnect, and use `STLS` handshakes which pure-Python `adb_shell` cannot negotiate. To make connections permanent and compatible with all Python drivers:\n```bash\nadb connect \u003cIP>:\u003cDYNAMIC_PORT>\nadb -s \u003cIP>:\u003cDYNAMIC_PORT> tcpip 5555\nadb connect \u003cIP>:5555\n```\nThis restarts the Android system ADB daemon on port **5555** with standard RSA token authentication.\n\n---\n\n## 4. TUI & Fleet Management\n\nRun PymordialDroid using `uv`:\n```bash\ncd /d D:\\projects\\PymordialDroid\nuv run pymordialdroid\n```\nOr run as a module:\n```bash\nuv run python -m pymordialdroid\n```\n\n### Features Matrix\n* **[1] Add Devices**: Performs synchronous USB scans or subnet sweeps to auto-discover phones, run `tcpip 5555`, and extract IP addresses via `ip route`.\n* **[2] Launch Viewer(s)**: Spawns `scrcpy.exe` with grid layout positioning, `--no-audio`, and optional `--turn-screen-off` (ghost mode to save battery).\n* **[3] Organize Windows**: Uses Win32 API (`user32.MoveWindow`) to auto-tile active viewers across multiple displays.\n* **[4] Kill All Viewers**: Gracefully terminates running `scrcpy.exe` processes.\n* **[5] Install APK**: Pushes APK updates in parallel across all fleet devices.\n* **[6] Device Details**: Inspects real-time battery percentages, response latency, and connection states.\n* **[7] Restore Layout**: Reopens scrcpy viewers from saved layout session.\n\n---\n\n## 5. Pymordial Contract Implementation\n\nPymordialDroid implements the core abstract interfaces defined by `Pymordial` (`D:\\projects\\Pymordial`), providing full interoperability with Pymordial's plugin and app state machine system.\n\n```mermaid\nclassDiagram\n    class PymordialController {\n        \u003c\u003cabstract>>\n        +connect()\n        +disconnect()\n        +bridge: PymordialBridgeDevice\n        +vision: PymordialVisionDevice\n    }\n    class PymordialDroidController {\n        +adb: PymordialAdbDevice\n        +ui: PymordialDroidUiDevice\n        +scrcpy: PymordialScrcpyDevice\n    }\n    class PymordialBridgeDevice {\n        \u003c\u003cabstract>>\n        +execute_shell_command()\n        +tap()\n        +swipe()\n        +key_event()\n    }\n    class PymordialAdbDevice {\n        +connect_adb()\n        +find_package_by_keyword()\n        +get_focused_app()\n    }\n    class PymordialVisionDevice {\n        \u003c\u003cabstract>>\n        +find_image()\n        +click_image()\n        +get_pixel_color()\n    }\n    class PymordialDroidUiDevice {\n        +find_image()\n        +click_image()\n        +get_pixel_color()\n    }\n    class PymordialApp {\n        \u003c\u003cabstract>>\n        +name: str\n        +state: AppState\n        +launch()\n        +stop()\n    }\n    class PymordialAndroidApp {\n        +package_name: str\n        +launch_activity: Optional[str]\n    }\n\n    PymordialController \u003c|-- PymordialDroidController\n    PymordialBridgeDevice \u003c|-- PymordialAdbDevice\n    PymordialVisionDevice \u003c|-- PymordialDroidUiDevice\n    PymordialApp \u003c|-- PymordialAndroidApp\n    PymordialDroidController *-- PymordialAdbDevice\n    PymordialDroidController *-- PymordialDroidUiDevice\n    PymordialDroidController *-- PymordialScrcpyDevice\n```\n\n### Core Classes & Roles\n1. **`PymordialAdbDevice` (`pymordialdroid.devices.adb_device`)**:\n   - Implements `PymordialBridgeDevice`.\n   - Supports pure-Python `adb_shell` over wireless port 5555 with automatic RSA key generation (`~/.android/adbkey`), falling back to CLI `adb.exe` if needed.\n   - Provides Android package discovery (`find_package_by_keyword`), launch activity resolution (`get_launch_activity`), and focused window detection (`get_focused_app`).\n2. **`PymordialDroidUiDevice` (`pymordialdroid.devices.ui_device`)**:\n   - Implements `PymordialVisionDevice`.\n   - Uses OpenCV template matching (`matchTemplate` with `TM_CCOEFF_NORMED`) for `PymordialImage` queries.\n   - Takes screenshots on-demand via ADB bridge (`screencap -p`).\n3. **`PymordialScrcpyDevice` (`pymordialdroid.devices.scrcpy_device`)**:\n   - Implements `PymordialDisplayDevice`.\n   - Manages background and foreground `scrcpy` subprocess instances.\n4. **`PymordialDroidController` (`pymordialdroid.droid_controller`)**:\n   - Implements `PymordialController`.\n   - Dynamically resolves and mounts bridge (`adb`), vision (`ui`), and display (`scrcpy`) devices.\n5. **`PymordialAndroidApp` (`pymordialdroid.android_app`)**:\n   - Extends `PymordialApp`.\n   - Manages app lifecycle (`launch`, `stop`, `restart`, `uninstall`) and state transitions."}, {"id": "pymordialdroid/configuration", "type": "Configuration Reference", "title": "PymordialDroid \u2014 Configuration & State Management", "description": "Directory locations, JSON schemas, PIN resolution rules, and window layout persistence in ~/.pymordialdroid/.", "tags": ["configuration", "json", "pin-resolution", "fleet-inventory", "persistence"], "group": "pymordialdroid", "sz": 34, "status": "stable", "stale_after": "", "generated": {"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}, "verified": [{"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}], "sources": [{"title": "PymordialDroid Config Module", "resource": "src/pymordialdroid/config.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# PymordialDroid \u2014 Configuration & State Management\n\nAll dynamic runtime data and user configuration are kept out of the source tree and stored in the user directory `~/.pymordialdroid/` (`%USERPROFILE%\\.pymordialdroid` on Windows):\n\n## 1. Global Configuration (`config.json`)\n\nLocated at `~/.pymordialdroid/config.json`:\n\n```json\n{\n    \"default_pin\": \"110516\",\n    \"adb_path\": null,\n    \"scrcpy_path\": null\n}\n```\n\n### PIN Resolution Precedence\nWhen unlocking devices or negotiating pairing codes, PIN is resolved in the following priority:\n1. Per-device `pin` in `fleet_inventory.json` (if specified)\n2. Environment variable `DEVICE_PIN` or `PYMORDIALDROID_PIN`\n3. `default_pin` in `~/.pymordialdroid/config.json`\n4. Hardcoded fallback `\"1234\"`\n\n---\n\n## 2. Fleet Inventory (`fleet_inventory.json`)\n\nLocated at `~/.pymordialdroid/fleet_inventory.json`. Holds records of all discovered or manually registered physical and virtual devices:\n\n```json\n[\n    {\n        \"serial\": \"172.20.8.50:5555\",\n        \"ip\": \"172.20.8.50\",\n        \"port\": 5555,\n        \"name\": \"Galaxy S24 Ultra\",\n        \"pin\": \"110516\"\n    }\n]\n```\n\n### Fields\n* `serial`: Unique ADB serial identifier (`\u003cip>:\u003cport>` for wireless, hardware serial for USB).\n* `ip`: Host IPv4 address.\n* `port`: ADB TCP port (typically `5555`).\n* `name`: Human-readable label displayed in TUI and window titles.\n* `pin`: (Optional) Device-specific screen unlock PIN override.\n\n---\n\n## 3. Viewer Layout Persistence (`viewer_layout.json`)\n\nLocated at `~/.pymordialdroid/viewer_layout.json`.\n\nTracks currently active `scrcpy` viewers across sessions so window arrangements, tile positions, and connected monitors can be restored automatically when restarting Fleet Commander.\n\n```json\n{\n    \"viewers\": [\n        {\n            \"serial\": \"172.20.8.50:5555\",\n            \"x\": 100,\n            \"y\": 100,\n            \"width\": 540,\n            \"height\": 1170,\n            \"title\": \"Galaxy S24 Ultra\"\n        }\n    ]\n}\n```\n\nSee also: [Architecture Guide](./architecture.md) and [Display Streaming](./display_streaming.md)."}, {"id": "pymordialdroid/display_streaming", "type": "Technical Specification", "title": "PymordialDroid \u2014 Display Streaming & Perception Pipeline", "description": "Low-latency scrcpy H.264 video streaming, Direct3D 11 rendering, frame providers, and screencap perception architecture.", "tags": ["scrcpy", "display-streaming", "direct3d11", "h264", "live-stream", "opencv", "perception"], "group": "pymordialdroid", "sz": 38, "status": "stable", "stale_after": "", "generated": {"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}, "verified": [{"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}], "sources": [{"title": "Genymobile scrcpy 4.1", "resource": "https://github.com/Genymobile/scrcpy", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# PymordialDroid \u2014 Display Streaming & Perception Pipeline\n\nPymordialDroid relies on `scrcpy` (version 4.1, SDL 3.4.12) to provide ultra-low-latency real-time video streaming, host window embedding, and real-time computer vision frame pipelines.\n\n---\n\n## 1. Streaming Infrastructure & Renderer\n\n* **Renderer Backend**: Direct3D 11 (`d3d11` on Windows) / OpenGL on Linux.\n* **Encoding**: Device-side hardware-accelerated H.264 via `MediaCodec`.\n* **Framerate & Latency**: Streams typically achieve **44\u201369 FPS** with an end-to-end frame age of **11\u201340 ms** over local Wi-Fi / USB.\n* **Audio**: Muted by default (`--no-audio`) to preserve host bandwidth and reduce audio buffer overhead.\n* **Ghost Mode**: Supports `--turn-screen-off` to stream display frames to the host while keeping the physical AMOLED display unpowered to prevent thermal throttling and save battery.\n\n---\n\n## 2. Real-Time Vision Feed vs. Full-Resolution Screencap\n\nReal-time automation requires balancing perception latency with image resolution:\n\n```mermaid\ngraph TD\n    Device[Physical Device Display 2340x1080] -->|MediaCodec H.264 Stream| ScrcpyServer[scrcpy-server 4.1]\n    Device -->|screencap -p| ADBD[adbd]\n    ScrcpyServer -->|TCP socket| HostStream[Live Stream Socket 960x442]\n    ADBD -->|ADB Pipe| Screencap[Full-Res PNG 2340x1080]\n    HostStream -->|Frame Provider| RealtimeVision[Real-Time Servo / Navigation 15-40ms]\n    Screencap -->|Direct Command| StateDetection[OCR / Template Matching / Color Checks 1-2s]\n```\n\n### 2.1 Live Stream Pipeline (`start_live_stream`)\n* Invoked via `controller.start_live_stream(max_size=960, max_fps=30)`.\n* Produces frames at **44\u201369 FPS** with frame ages between **11\u201340 ms**.\n* Ingests into `AndroidController.capture_screen()`, providing sub-100 ms loop latency.\n* **Actual Resolution Note**: While requested with `max_size=960`, the actual frame dimensions are **`960x442`** (not `960x440`), because `scrcpy` rounds downscaled dimensions to even integers. Vision code must read `frame.shape[:2]` dynamically.\n\n### 2.2 Full-Resolution Screencap Pipeline\n* Plain `adb shell screencap -p` captures uncompressed PNG frames at native device resolution (**`2340x1080`** on Galaxy S24 Ultra).\n* Latency: Costs **1.0\u20132.0 seconds** per capture.\n* Suitable for: Static state detection (title screen, loading bars), OCR text recognition, and pixel-exact template matching.\n* Bypass command: `controller.bridge.run_command(\"screencap -p\", decode=False)`.\n\n---\n\n## 3. Coordinate Space Transformation\n\nWhen processing detections between live feed frames and device touch coordinates:\n\n$$\\text{Scale}_X = \\frac{W_{\\text{device}}}{W_{\\text{stream}}} = \\frac{2340}{960} = 2.4375$$\n\n$$\\text{Scale}_Y = \\frac{H_{\\text{device}}}{H_{\\text{stream}}} = \\frac{1080}{442} \\approx 2.4434$$\n\nSee also: [Touch Injection](./touch_injection.md), [Architecture](./architecture.md), and [Issues](./issues.md)."}, {"id": "pymordialdroid/issues", "type": "Issue Tracker", "title": "PymordialDroid \u2014 Bugs, Issues & Fieldwork Findings", "description": "Living log of host-side automation gaps, touch injection resolutions, and perception caveats encountered during fieldwork.", "tags": ["issues", "touch-injection", "motionevent", "scrcpy-control", "selinux", "s24-ultra"], "group": "pymordialdroid", "sz": 41, "status": "stable", "stale_after": "", "generated": {"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}, "verified": [{"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}], "sources": [{"title": "Samsung Galaxy S24 Ultra Live Verification", "resource": "device:SM-S928U", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# PymordialDroid \u2014 Bugs, Issues & Fieldwork Findings\n\nLiving log of host-side automation gaps encountered while testing game automation on physical hardware (Galaxy S24 Ultra, `SM-S928U`, over USB/TCP). Updated 2026-09-16.\n\n---\n\n## 1. Fine Camera Deadzone (HIGH \u2014 Resolved)\n* **Symptom:** Single coarse swipes \u003c600 px in 2340x1080 space produced zero rotation because the game engine gated on minimum swipe velocity/distance.\n* **Resolution (2026-09-16):** Resolved via `precise_drag` on `AdbDevice` which emits dense, interpolated move events (e.g. 24 steps with 16 ms spacing). 200 px drags now register reliably for sub-30\u00b0 camera trims.\n\n---\n\n## 2. Touch Hold & Multi-Touch Injection (HIGH \u2014 Resolved)\n* **Symptom:** Standard ADB `input swipe` always lifts the touch at completion, causing a stop-start stuttering gait during continuous locomotion.\n* **SELinux Denial:** Non-rooted retail Samsung hardware forbids shell UID from writing directly to `/dev/input/event*` (`sendevent` gets `Permission denied`).\n* **Single-Pointer Hold:** Implemented via `MotionEventInjector` (`input motionevent \u003cDOWN|MOVE|UP>`). Allows smooth continuous walking for arbitrary durations on slot 0.\n* **Multi-Touch Resolution:** Resolved via `scrcpy-control` (`ScrcpyControlInjector`, `devices/scrcpy_control.py`). Headless scrcpy server accepts binary multi-touch packets without root or SELinux restrictions, enabling simultaneous dual-thumb gameplay (joystick on slot 0 + camera drag on slot 1).\n\n---\n\n## 3. Built-In Anti-AFK Scheduler (MEDIUM)\n* **Symptom:** Game server disconnects idle players after inactivity (up to 21 min; shorter when camera-only movements occur). Camera swipes do not reset the server idle timer.\n* **Workaround:** Periodic virtual joystick micro-nudges (`swipe(280, 702 -> 280, 550, 400ms)`) every \u003c180 s keep the session alive.\n* **Needed:** Background worker on `AndroidController` to automate keep-alive micro-nudges when no user actions are executing.\n\n---\n\n## 4. Landscape / Portrait Coordinate Confusion (MEDIUM)\n* **Symptom:** `wm size` reports `1080x2340` (portrait), while games run in `2340x1080` (landscape), and live streams output `960x442`.\n* **Needed:** Dynamic orientation helpers: `to_device_coords(rx, ry)` and `from_live_frame(x, y)`.\n\n---\n\n## 5. Live Stream Actual Resolution Mismatch (MEDIUM \u2014 Worked Around)\n* **Symptom:** With `start_live_stream(max_size=960)`, scrcpy rounds downscaled dimensions to even values, yielding `960x442` rather than `960x440`. Code hardcoding 440 suffers a 2 px vertical drift.\n* **Workaround:** Dynamic inspection of frame dimensions: `frame.shape[:2]`.\n\n---\n\n## 6. Menu UI Touch Interception (LOW)\n* **Symptom:** Unity UI canvas intercepts touches when menus remain open, leaving navigation input dead.\n* **Requirement:** Strict discipline to close menus via Master Arrow re-tap before issuing locomotion commands.\n\n---\n\n## 7. `capture_screen()` Frame Provider Bug (MEDIUM)\n* **Symptom:** When live stream is active, `capture_screen()` returns the 960x442 live frame instead of native 2340x1080 screenshot, breaking routines that expect full-resolution coordinates.\n* **Workaround:** Bypass frame provider for high-resolution OCR using `controller.bridge.run_command(\"screencap -p\", decode=False)`.\n* **Needed:** Explicit `capture_fullres()` method on `AndroidController`.\n\n---\n\nSee also: [Touch Injection Architecture](./touch_injection.md) and [Display Streaming](./display_streaming.md)."}, {"id": "pymordialdroid/touch_injection", "type": "API Reference", "title": "PymordialDroid \u2014 Touch Injection & Multi-Touch Architecture", "description": "Low-level touch injection backends (scrcpy-control, motionevent, sendevent) and Unified Touch API on AdbDevice.", "tags": ["touch-injection", "multitouch", "scrcpy-control", "motionevent", "sendevent", "gesture", "adb"], "group": "pymordialdroid", "sz": 44, "status": "stable", "stale_after": "", "generated": {"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}, "verified": [{"by": "human:IAmNo1Special", "at": "2026-09-16 05:15:00+00:00"}], "sources": [{"title": "Scrcpy Control Client Implementation", "resource": "src/pymordialdroid/devices/scrcpy_control.py", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "Samsung Galaxy S24 Ultra Android 16 Verification", "resource": "device:SM-S928U", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# PymordialDroid \u2014 Touch Injection & Multi-Touch Architecture\n\n`PymordialDroid` provides fine-grained, low-latency touch injection via a multi-tiered backend architecture implemented on `AdbDevice` (`devices/adb_device.py`).\n\n---\n\n## 1. Backend Tier Hierarchy\n\n```mermaid\ngraph TD\n    Request[Touch / Gesture Request] --> Check{Backend Selection}\n    Check -->|Non-root Multi-Touch / Low Latency| ScrcpyCtrl[scrcpy-control Daemon Socket]\n    Check -->|Single-Pointer Android 14+| MotionEvent[input motionevent DOWN / MOVE / UP]\n    Check -->|Root / Permissive SELinux| SendEvent[Linux Kernel /dev/input/event*]\n    Check -->|Fallback| Swipe[Legacy input swipe / tap]\n```\n\n### 1.1 `scrcpy-control` (`ScrcpyControlInjector`, `devices/scrcpy_control.py`)\n* **Capabilities**: True concurrent multi-touch (slots 0\u20139+), $\u003c1\\text{ ms}$ packet latency, 60+ Hz stream fidelity, non-root.\n* **Mechanism**: Runs a headless `scrcpy-server` instance (`video=false audio=false control=true cleanup=false`) via `app_process` as UID 2000 (`shell`). Sends 32-byte binary `INJECT_TOUCH_EVENT` packets over a local TCP tunnel (`adb forward tcp:\u003cport> localabstract:scrcpy_\u003cscid>`).\n* **Binary Packet Format**: Big-endian 32-byte struct:\n  `struct.pack('>BBQiiHHHii', 2, action, pointer_id, x, y, width, height, 0xffff, 0, 0)`\n  where action: `0=DOWN`, `1=UP`, `2=MOVE`.\n* **Server-Side Tracking**: Server's internal `PointersState` automatically synthesizes pointer masks (`ACTION_POINTER_DOWN` / `ACTION_POINTER_UP`), allowing simultaneous two-thumb operation (joystick + camera).\n* **Startup Policy**: Lazy initialization on first slot > 0 request or eager start via `start_multitouch()` / `scrcpy_control=True`. Once running, serves all slots.\n\n### 1.2 `motionevent` (`MotionEventInjector`, `devices/motionevent_injector.py`)\n* **Capabilities**: Low-cost single-pointer touch hold and fine drags on non-rooted Android 14+.\n* **Mechanism**: Executes `adb shell input motionevent \u003cDOWN|MOVE|UP> \u003cx> \u003cy>`.\n* **Limitation**: Strictly single-pointer (AOSP `InputShellCommand` hardcodes `pointerCount = 1`, `pointerId = 0`). Requests for slot > 0 log a warning and return False.\n\n### 1.3 `sendevent` (`TouchInjector`, `devices/touch_injector.py`)\n* **Capabilities**: Direct Linux kernel multi-touch protocol (type-B slots) via `/dev/input/event*`.\n* **Limitation**: Requires root or permissive SELinux; denied by SELinux on retail Samsung hardware (One UI 6.1+).\n\n### 1.4 `input swipe` (Legacy fallback)\n* Coarse fallback for basic taps and long-presses when fine touch injection is completely unavailable.\n\n---\n\n## 2. Unified Touch API (`AdbDevice`)\n\nAll controller touch interactions flow through unified methods:\n\n```python\n# Presses contact down at display pixel coordinates\ndev.touch_down(x, y, slot=0)\n\n# Moves active contact to new pixel coordinates\ndev.touch_move(x, y, slot=0)\n\n# Lifts contact on the given slot\ndev.touch_up(slot=0)\n\n# Releases contact for stuck-gesture recovery\ndev.touch_cancel(slot=0)\n\n# Holds contact down continuously for duration without release\ndev.touch_hold(x, y, duration_ms, slot=0)\n\n# Context manager holding contact down for duration of Python block\nwith dev.held_touch(x, y, slot=0):\n    do_something()\n\n# Emits dense interpolated move stream for fine camera trims and gesture gating\ndev.precise_drag(x1, y1, x2, y2, steps=24, step_delay_ms=16, slot=0)\n\n# Starts the persistent scrcpy-control daemon explicitly\ndev.start_multitouch(timeout=20.0)\n```\n\n---\n\n## 3. Two-Thumb Concurrent Multi-Touch Pattern\n\nExecuting concurrent locomotion and camera rotations without root:\n\n```python\n# Enable scrcpy multi-touch daemon\ndev.start_multitouch()\n\n# Left Thumb (slot 0): Grab joystick knob and push forward\ndev.touch_down(280, 702, slot=0)\ndev.touch_move(280, 550, slot=0)\n\n# Right Thumb (slot 1): Concurrently rotate camera via precise interpolated drag\ndev.precise_drag(1755, 540, 1305, 540, steps=35, step_delay_ms=25, slot=1)\n\n# Release Left Thumb\ndev.touch_up(slot=0)\n```\n\nSee also: [Architecture Guide](./architecture.md), [Display Streaming](./display_streaming.md), and [Revomon Locomotion](../games/revomon_novus/locomotion.md)."}], EDGES=[{"source": "games/revomon_novus/combat_slingshot", "target": "games/revomon_novus/hud_interface"}, {"source": "games/revomon_novus/combat_slingshot", "target": "games/revomon_novus/locomotion"}, {"source": "games/revomon_novus/hud_interface", "target": "games/revomon_novus/locomotion"}, {"source": "games/revomon_novus/hud_interface", "target": "games/revomon_novus/combat_slingshot"}, {"source": "games/revomon_novus/locomotion", "target": "pymordialdroid/touch_injection"}, {"source": "games/revomon_novus/locomotion", "target": "games/revomon_novus/hud_interface"}, {"source": "games/revomon_novus/profile", "target": "games/revomon_novus/hud_interface"}, {"source": "games/revomon_novus/profile", "target": "games/revomon_novus/locomotion"}, {"source": "games/revomon_novus/profile", "target": "games/revomon_novus/combat_slingshot"}, {"source": "games/revomon_novus/profile", "target": "games/revomon_novus/vision_anchors"}, {"source": "games/revomon_novus/vision_anchors", "target": "games/revomon_novus/profile"}, {"source": "games/revomon_novus/vision_anchors", "target": "games/revomon_novus/hud_interface"}, {"source": "games/revomon_novus/vision_anchors", "target": "pymordialdroid/display_streaming"}, {"source": "pymordialdroid/architecture", "target": "pymordialdroid/configuration"}, {"source": "pymordialdroid/architecture", "target": "pymordialdroid/display_streaming"}, {"source": "pymordialdroid/architecture", "target": "pymordialdroid/touch_injection"}, {"source": "pymordialdroid/architecture", "target": "pymordialdroid/issues"}, {"source": "pymordialdroid/configuration", "target": "pymordialdroid/architecture"}, {"source": "pymordialdroid/configuration", "target": "pymordialdroid/display_streaming"}, {"source": "pymordialdroid/display_streaming", "target": "pymordialdroid/touch_injection"}, {"source": "pymordialdroid/display_streaming", "target": "pymordialdroid/architecture"}, {"source": "pymordialdroid/display_streaming", "target": "pymordialdroid/issues"}, {"source": "pymordialdroid/issues", "target": "pymordialdroid/touch_injection"}, {"source": "pymordialdroid/issues", "target": "pymordialdroid/display_streaming"}, {"source": "pymordialdroid/touch_injection", "target": "pymordialdroid/architecture"}, {"source": "pymordialdroid/touch_injection", "target": "pymordialdroid/display_streaming"}, {"source": "pymordialdroid/touch_injection", "target": "games/revomon_novus/locomotion"}];
const PALETTE=["#6E56CF","#D97757","#22C55E","#3B82F6","#EAB308","#EC4899","#14B8A6","#F97316","#A855F7","#0EA5E9","#84CC16","#EF4444","#64748B"];
const byId=Object.fromEntries(NODES.map(n=>[n.id,n]));
const outL={}, inL={};
NODES.forEach(n=>{outL[n.id]=[];inL[n.id]=[];});
EDGES.forEach(e=>{outL[e.source].push(e.target);inL[e.target].push(e.source);});

const off=new Set();
const cy=cytoscape({container:document.getElementById('cy'),minZoom:.2,maxZoom:1.6,wheelSensitivity:.2,
 elements:[...NODES.map(n=>({data:{...n,c:color[n.type]}})),...EDGES.map(e=>({data:e}))],

  {selector:'node',style:{'background-color':'data(c)','label':'data(title)','color':'#e6e8ee',

 ],
 layout:{name:'cose',animate:false,nodeRepulsion:9000,idealEdgeLength:90,padding:40}});
const side=document.getElementById('side');
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function relList(title,arr){if(!arr.length)return'';
 return `<div class="rel"><h4>${title}</h4>${arr.map(id=>`<a data-go="${esc(id)}">${esc((byId[id]||{}).title||id)}</a>`).join('')}</div>`;}
// §5.3 — the trust tier is derived, never stored: no `verified` is unverified,
// `verified` by non-`human:` actors only is machine-confirmed, and any `human:`
// actor makes it human-reviewed. The exact lowercase prefix is the whole key.
// §5.5 — a concept is stale when today >= stale_after; both are YYYY-MM-DD, so
// a string compare is the whole comparison. Advisory signals, not access control.
const TODAY=new Date().toISOString().slice(0,10);
function trustTier(n){const v=n.verified||[];
 if(!v.length)return['t-unverified','unverified'];
 return v.some(e=>(e.by||'').startsWith('human:'))?['t-human','human-reviewed']
                                                  :['t-machine','machine-confirmed'];}
function badges(n){const [cls,label]=trustTier(n),out=[`<span class="badge ${cls}">${label}</span>`];
 if(n.stale_after&&TODAY>=n.stale_after)out.push(`<span class="badge b-stale">stale since ${esc(n.stale_after)}</span>`);
 if(n.status==='deprecated')out.push('<span class="badge b-deprecated">deprecated</span>');
 return `<div class="badges">${out.join('')}</div>`;}
// OKF v0.2 trust (§5.2) + lifecycle (§5.4/§5.5). A v0.1 `timestamp` arrives here
// as generated.at with an empty `by`, so legacy bundles still show a date.
function metaBlock(n){const g=n.generated||{},rows=[];
 if(n.status)rows.push(`<div>status <b>${esc(n.status)}</b></div>`);
 if(g.at||g.by)rows.push(`<div>generated${g.at?` <b>${esc(g.at)}</b>`:''}${g.by?` by ${esc(g.by)}`:''}</div>`);
 (n.verified||[]).forEach(v=>rows.push(`<div>verified${v.at?` <b>${esc(v.at)}</b>`:''}${v.by?` by ${esc(v.by)}`:''}</div>`));
 if(n.stale_after)rows.push(`<div>stale after <b>${esc(n.stale_after)}</b></div>`);
 return rows.length?`<div class="meta">${rows.join('')}</div>`:'';}
// Provenance (§5.1). A source may be another concept (graph link), an external
// URL, or a scope descriptor that is not followable at all.
function srcList(n){const s=n.sources||[];if(!s.length)return'';
 return `<div class="rel"><h4>Sources</h4>${s.map(x=>{
  const used=x.usage_count!=null?`used ${x.usage_count}×${x.usage_window?` (${x.usage_window})`:''}`:'';
  const sig=[x.author,used,x.last_modified].filter(Boolean).join(' · ');
  const label=esc(x.title||x.resource)+(sig?` <span class="sig">(${esc(sig)})</span>`:'');
  if(x.cid&&byId[x.cid])return `<a data-go="${esc(x.cid)}">${label}</a>`;
  if(/^https?:\/\//i.test(x.resource))return `<a href="${esc(x.resource)}" target="_blank" rel="noopener">${label}</a>`;
  return `<span class="empty">${label}</span>`;}).join('')}</div>`;}
// Resolve an in-body markdown link href to a concept id, mirroring build()'s
// resolution: strip #anchor, require .md, absolute strips leading /, relative
// resolves against the current concept's dir. Returns null if it's not a concept.
function resolveHref(cid,href){let t=(href||'').split('#')[0];if(!t.endsWith('.md'))return null;
 let tgt;if(t[0]==='/'){tgt=t.replace(/^\/+/,'').slice(0,-3);}
 else{const base=cid.split('/').slice(0,-1);
  for(const seg of t.slice(0,-3).split('/')){if(seg===''||seg==='.')continue;
   if(seg==='..'){if(!base.length)return null;base.pop();}else base.push(seg);}
  tgt=base.join('/');}
 return byId[tgt]?tgt:null;}
function show(id){const n=byId[id];if(!n)return;const c=color[n.type];
 side.innerHTML=`<span class="type" style="background:${c}">${esc(n.type)}</span>
 <h2>${esc(n.title)}</h2><div class="desc">${esc(n.description)||'<span class=empty>no description</span>'}</div>
 <div class="tags">${(n.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
 ${badges(n)}${metaBlock(n)}${srcList(n)}${relList('Links to',outL[id])}${relList('Cited by',inL[id])}
 <div class="body">${n.body?DOMPurify.sanitize(marked.parse(n.body)):'<span class=empty>empty body</span>'}</div>`;
 side.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>select(a.getAttribute('data-go')));
 side.querySelectorAll('.body a[href]').forEach(a=>{const tgt=resolveHref(id,a.getAttribute('href'));
  if(tgt)a.onclick=e=>{e.preventDefault();select(tgt);};});}
function select(id){const ele=cy.getElementById(id);if(!ele.length)return;show(id);
 cy.elements().removeClass('hl').addClass('dim');const nb=ele.closedNeighborhood();nb.removeClass('dim');ele.addClass('hl');
 cy.animate({center:{eles:ele},duration:250});
 try{if(decodeURIComponent((location.hash||'').slice(1))!==id)location.hash=encodeURIComponent(id);}catch(e){}}
cy.on('tap','node',e=>select(e.target.id()));
cy.on('tap',e=>{if(e.target===cy)cy.elements().removeClass('dim hl');});

 cy.batch(()=>cy.nodes().forEach(n=>{const d=n.data();

        &&(!ty||d.type===ty)&&!off.has(d.type);
  n.style('display',m?'element':'none');}));}
let debounce;
document.getElementById('search').oninput=()=>{clearTimeout(debounce);debounce=setTimeout(applyFilter,150);};
